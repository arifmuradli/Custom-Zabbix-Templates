            - tag: component
              value: tape
      discovery_rules:
        - uuid: 55670dcaefc04ef6bb21aa7088391b3a
          name: 'Veeam: Proxies discovery'
          type: DEPENDENT
          key: veeam.lite.proxies.discovery
          delay: '0'
          lld_macro_paths:
            - lld_macro: '{#ID}'
              path: $.id
            - lld_macro: '{#NAME}'
              path: $.name
            - lld_macro: '{#TYPE}'
              path: $.type
          master_item:
            key: veeam.lite.proxies.get
          item_prototypes:
            - uuid: 22d80a0f56ef43a5878e03a19b38f459
              name: 'Proxy [{#NAME}]: Max task count'
              type: DEPENDENT
              key: 'veeam.lite.proxy.maxtask[{#ID}]'
              delay: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.id==''{#ID}'')].max_tasks.first()'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: veeam.lite.proxies.get
              tags:
                - tag: component
                  value: proxies
                - tag: proxy
                  value: '{#NAME}'
            - uuid: 82485a0bf2ad4d92b7c839464351504a
              name: 'Proxy [{#NAME}]: Host name'
              type: DEPENDENT
              key: 'veeam.lite.proxy.host.name[{#ID}]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.id==''{#ID}'')].host_name.first()'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: veeam.lite.proxies.get
              tags:
                - tag: component
                  value: proxies
                - tag: proxy
                  value: '{#NAME}'
            - uuid: 7f1fd8593cc044cfa98504ae0fcb09a5
              name: 'Proxy [{#NAME}]: Host type'
              type: DEPENDENT
              key: 'veeam.lite.proxy.host.type[{#ID}]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.id==''{#ID}'')].host_type.first()'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: veeam.lite.proxies.get
              tags:
                - tag: component
                  value: proxies
                - tag: proxy
                  value: '{#NAME}'
        - uuid: 42a7a644c9764935964ced6ea55dfd6e
          name: 'Veeam: Repositories discovery'
          type: DEPENDENT
          key: veeam.lite.repos.discovery
          delay: '0'
          lld_macro_paths:
            - lld_macro: '{#ID}'
              path: $.id
            - lld_macro: '{#NAME}'
              path: $.name
            - lld_macro: '{#TYPE}'
              path: $.type
          master_item:
            key: veeam.lite.repos.get
          item_prototypes:
            - uuid: d25cb1789d9c4d31b8bd31731fb61038
              name: 'Repository [{#NAME}]: Capacity'
              type: DEPENDENT
              key: 'veeam.lite.repo.capacity[{#ID}]'
              delay: '0'
              units: B
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.id==''{#ID}'')].capacity.first()'
              master_item:
                key: veeam.lite.repos.get
              tags:
                - tag: component
                  value: repository
                - tag: repository
                  value: '{#NAME}'
            - uuid: 6022568e030a4efc9776c19c420b1d13
              name: 'Repository [{#NAME}]: Free space'
              type: DEPENDENT
              key: 'veeam.lite.repo.free[{#ID}]'
              delay: '0'
              units: B
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.id==''{#ID}'')].free.first()'
              master_item:
                key: veeam.lite.repos.get
              tags:
                - tag: component
                  value: repository
                - tag: repository
                  value: '{#NAME}'
            - uuid: 89269a970e0f47c485c7f30ce3eaf547
              name: 'Repository [{#NAME}]: Used space'
              type: DEPENDENT
              key: 'veeam.lite.repo.used[{#ID}]'
              delay: '0'
              units: B
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.id==''{#ID}'')].used.first()'
              master_item:
                key: veeam.lite.repos.get
              tags:
                - tag: component
                  value: repository
                - tag: repository
                  value: '{#NAME}'
            - uuid: d64159d22e0248fb8b1a07c6984df83a
              name: 'Repository [{#NAME}]: Free space, %'
              type: DEPENDENT
              key: 'veeam.lite.repo.free.pct[{#ID}]'
              delay: '0'
              value_type: FLOAT
              units: '%'
              description: '-1 when capacity is not reported (e.g. some object storage/tape).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.id==''{#ID}'')].free_pct.first()'
              master_item:
                key: veeam.lite.repos.get
              tags:
                - tag: component
                  value: repository
                - tag: repository
                  value: '{#NAME}'
              trigger_prototypes:
                - uuid: 45b09e477d6044639c638a9b6237f5fe
                  expression: 'last(/Veeam Backup Lite by HTTP/veeam.lite.repo.free.pct[{#ID}])>=0 and last(/Veeam Backup Lite by HTTP/veeam.lite.repo.free.pct[{#ID}])<{$VEEAM.REPO.FREE.MIN.PCT}'
                  name: 'Veeam: Repository [{#NAME}] free space below {$VEEAM.REPO.FREE.MIN.PCT}%'
                  opdata: 'Free: {ITEM.LASTVALUE1}'
                  priority: WARNING
            - uuid: 9cba7126352947c4b084c6e2c8350809
              name: 'Repository [{#NAME}]: Online'
              type: DEPENDENT
              key: 'veeam.lite.repo.online[{#ID}]'
              delay: '0'
              description: '1 = online, 0 = offline, -1 = not reported by this API version.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.id==''{#ID}'')].online.first()'
              master_item:
                key: veeam.lite.repos.get
              tags:
                - tag: component
                  value: repository
                - tag: repository
                  value: '{#NAME}'
              trigger_prototypes:
                - uuid: d7eac32d41b948c281c1136337f11fca
                  expression: 'last(/Veeam Backup Lite by HTTP/veeam.lite.repo.online[{#ID}])=0'
                  name: 'Veeam: Repository [{#NAME}] is offline'
                  priority: AVERAGE
      macros:
        - macro: '{$VEEAM.API.URL}'
          value: 'https://localhost:9419'
        - macro: '{$VEEAM.API.VERSION}'
          value: 1.3-rev1
        - macro: '{$VEEAM.USER}'
        - macro: '{$VEEAM.PASSWORD}'
          type: SECRET_TEXT
        - macro: '{$VEEAM.HTTP.PROXY}'
        - macro: '{$VEEAM.DATA.TIMEOUT}'
          value: 60s
          description: 'Script timeout. Keep below the item intervals.'
        - macro: '{$VEEAM.REPOS.INTERVAL}'
          value: 10m
        - macro: '{$VEEAM.PROXIES.INTERVAL}'
          value: 1h
        - macro: '{$VEEAM.SESSIONS.INTERVAL}'
          value: 5m
        - macro: '{$VEEAM.SESSIONS.HOURS}'
          value: '26'
          description: 'Lookback window for sessions. Slightly over 24h so daily jobs are always seen.'
        - macro: '{$VEEAM.RUNNING.MAX.HOURS}'
          value: '12'
        - macro: '{$VEEAM.SESSION.NAME.NOT_MATCHES}'
          value: '^(Security & Compliance Analyzer|Malware Detection|Configuration Database Resynchronize.*)$'
          description: 'Regex of session names to ignore completely (no failed/warning/running alerts).'
        - macro: '{$VEEAM.SESSION.TYPE.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Regex of session types to ignore completely. See the "Session types" item for the values your VBR returns.'
        - macro: '{$VEEAM.RUNNING.NAME.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Regex of session names excluded only from the long-running check (still checked for failed/warning).'
        - macro: '{$VEEAM.REPO.FREE.MIN.PCT}'
          value: '15'
        - macro: '{$VEEAM.TAPE.INTERVAL}'
          value: 20m
          description: 'How often the agent runs veeam_tape.ps1.'
        - macro: '{$VEEAM.TAPE.WAIT.MIN}'
          value: '20'
          description: 'Minutes a tape job may be in WaitingTape before alerting.'
  triggers:
    - uuid: 15c7f1ab5bec41fcbcf4b3b4304249b8
      expression: 'last(/Veeam Backup Lite by HTTP/veeam.lite.jobs.failed.names)<>"none" and (change(/Veeam Backup Lite by HTTP/veeam.lite.jobs.failed.names)=1 or count(/Veeam Backup Lite by HTTP/veeam.lite.jobs.failed.names,#2)=1)'
      recovery_mode: RECOVERY_EXPRESSION
      recovery_expression: 'last(/Veeam Backup Lite by HTTP/veeam.lite.jobs.failed.names)="none"'
      name: 'Veeam: Job(s) failed'
      event_name: 'Veeam: Job(s) failed: {ITEM.LASTVALUE1}'
      type: MULTIPLE
      manual_close: 'YES'
      priority: AVERAGE
      description: 'Fires once when the list of failed jobs changes. Manual close sticks until a new failure appears; resolves by itself when no job is failed.'
    - uuid: 885afde9eb7348a59587c3c3bc126e0e
      expression: 'last(/Veeam Backup Lite by HTTP/veeam.lite.jobs.warning.names)<>"none" and (change(/Veeam Backup Lite by HTTP/veeam.lite.jobs.warning.names)=1 or count(/Veeam Backup Lite by HTTP/veeam.lite.jobs.warning.names,#2)=1)'
      recovery_mode: RECOVERY_EXPRESSION
      recovery_expression: 'last(/Veeam Backup Lite by HTTP/veeam.lite.jobs.warning.names)="none"'
      name: 'Veeam: Job(s) ended with warning'
      event_name: 'Veeam: Job(s) ended with warning: {ITEM.LASTVALUE1}'
      type: MULTIPLE
      manual_close: 'YES'
      priority: WARNING
      description: 'Fires once when the list of warning jobs changes. Manual close sticks until a new failure appears; resolves by itself when no job is warning.'
    - uuid: d8206ad50e054cf4ac3b93809b8de105
      expression: 'last(/Veeam Backup Lite by HTTP/veeam.lite.sessions.long_running)>0 and length(last(/Veeam Backup Lite by HTTP/veeam.lite.sessions.long_running.names))>0'
      name: 'Veeam: {ITEM.LASTVALUE1} session(s) running longer than {$VEEAM.RUNNING.MAX.HOURS}h'
      manual_close: 'YES'
      opdata: '{ITEM.LASTVALUE2}'
      priority: WARNING
    - uuid: f21c40826fc041949bd4d926be34574b
      expression: 'last(/Veeam Backup Lite by HTTP/veeam.tape.waiting.names)<>"none" and (change(/Veeam Backup Lite by HTTP/veeam.tape.waiting.names)=1 or count(/Veeam Backup Lite by HTTP/veeam.tape.waiting.names,#2)=1)'
      recovery_mode: RECOVERY_EXPRESSION
      recovery_expression: 'last(/Veeam Backup Lite by HTTP/veeam.tape.waiting.names)="none"'
      name: 'Veeam: Tape job(s) waiting for tape'
      event_name: 'Veeam: Tape job(s) waiting for tape: {ITEM.LASTVALUE1}'
      type: MULTIPLE
      manual_close: 'YES'
      priority: HIGH
      description: 'Tape job in WaitingTape longer than {$VEEAM.TAPE.WAIT.MIN} min. Usually no free/writable media in the pool or the library/drive is offline. Fires once per change; resolves when nothing is waiting.'
    - uuid: 5493c9803e8b439cb0e106ea16e5d19f
      expression: 'last(/Veeam Backup Lite by HTTP/veeam.tape.failed.names)<>"none" and (change(/Veeam Backup Lite by HTTP/veeam.tape.failed.names)=1 or count(/Veeam Backup Lite by HTTP/veeam.tape.failed.names,#2)=1)'
      recovery_mode: RECOVERY_EXPRESSION
      recovery_expression: 'last(/Veeam Backup Lite by HTTP/veeam.tape.failed.names)="none"'
      name: 'Veeam: Tape job(s) failed'
      event_name: 'Veeam: Tape job(s) failed: {ITEM.LASTVALUE1}'
      type: MULTIPLE
      manual_close: 'YES'
      priority: AVERAGE
      description: 'Last result of an enabled tape job is Failed. Fires once per change.'
    - uuid: b210e73a64e54ce38e2387f2cae6a9cb
      expression: 'last(/Veeam Backup Lite by HTTP/veeam.tape.warning.names)<>"none" and (change(/Veeam Backup Lite by HTTP/veeam.tape.warning.names)=1 or count(/Veeam Backup Lite by HTTP/veeam.tape.warning.names,#2)=1)'
      recovery_mode: RECOVERY_EXPRESSION
      recovery_expression: 'last(/Veeam Backup Lite by HTTP/veeam.tape.warning.names)="none"'
      name: 'Veeam: Tape job(s) ended with warning'
      event_name: 'Veeam: Tape job(s) ended with warning: {ITEM.LASTVALUE1}'
      type: MULTIPLE
      manual_close: 'YES'
      priority: WARNING
      description: 'Last result of an enabled tape job is Warning. Fires once per change.'
    - uuid: 2cc91d7dfc1d48e38ac2ba19b7477d03
      expression: 'length(last(/Veeam Backup Lite by HTTP/veeam.tape.error))>0 and (change(/Veeam Backup Lite by HTTP/veeam.tape.error)=1 or count(/Veeam Backup Lite by HTTP/veeam.tape.error,#2)=1)'
      recovery_mode: RECOVERY_EXPRESSION
      recovery_expression: 'length(last(/Veeam Backup Lite by HTTP/veeam.tape.error))=0'
      name: 'Veeam: Tape status script error'
      event_name: 'Veeam: Tape status script error: {ITEM.LASTVALUE1}'
      manual_close: 'YES'
      priority: WARNING
