        - uuid: d03c4e0c5cf041ef8a1ed73aa0c78d2e
          name: 'Veeam: Get proxies'
          type: SCRIPT
          key: veeam.lite.proxies.get
          delay: '{$VEEAM.PROXIES.INTERVAL}'
          history: 7d
          value_type: TEXT
          trends: '0'
          timeout: '{$VEEAM.DATA.TIMEOUT}'
          description: 'Proxies from /api/v1/backupInfrastructure/proxies joined with managedServers for host name/type.'
          params: |
            var p = JSON.parse(value),
                base = String(p.url).replace(/\/+$/, ''),
                req = new HttpRequest(),
                token = null;

            if (p.proxy) { req.setProxy(p.proxy); }

            function call(method, path, body) {
                req.clearHeader();
                req.addHeader('x-api-version: ' + p.version);
                req.addHeader('Accept: application/json');
                if (token) { req.addHeader('Authorization: Bearer ' + token); }
                var resp;
                if (method === 'POST') {
                    req.addHeader('Content-Type: application/x-www-form-urlencoded');
                    resp = req.post(base + path, body);
                } else {
                    resp = req.get(base + path);
                }
                var status = req.getStatus();
                if (status < 200 || status >= 300) {
                    throw 'HTTP ' + status + ' on ' + path + ': ' + String(resp).substring(0, 300);
                }
                return resp ? JSON.parse(resp) : {};
            }

            function login() {
                token = call('POST', '/api/oauth2/token',
                    'grant_type=password&username=' + encodeURIComponent(p.user) +
                    '&password=' + encodeURIComponent(p.password)).access_token;
                if (!token) { throw 'No access_token in token response'; }
            }

            function logout() {
                try { call('POST', '/api/oauth2/logout', ''); } catch (e) {}
            }

            function getAll(path) {
                var out = [], skip = 0, limit = 200, page;
                do {
                    page = call('GET', path + (path.indexOf('?') >= 0 ? '&' : '?') +
                        'skip=' + skip + '&limit=' + limit).data || [];
                    out = out.concat(page);
                    skip += limit;
                } while (page.length === limit && skip < 10000);
                return out;
            }

            login();
            var proxies, servers;
            try {
                proxies = getAll('/api/v1/backupInfrastructure/proxies');
                servers = getAll('/api/v1/backupInfrastructure/managedServers');
            } finally {
                logout();
            }

            var byId = {};
            servers.forEach(function (s) { byId[s.id] = s; });

            return JSON.stringify(proxies.map(function (x) {
                var srv = (x.server && byId[x.server.hostId]) || {};
                return {
                    id: x.id,
                    name: x.name,
                    type: x.type,
                    description: x.description || '',
                    max_tasks: (x.server && x.server.maxTaskCount) || 0,
                    host_name: srv.name || '',
                    host_type: srv.type || ''
                };
            }));
          parameters:
            - name: url
              value: '{$VEEAM.API.URL}'
            - name: version
              value: '{$VEEAM.API.VERSION}'
            - name: user
              value: '{$VEEAM.USER}'
            - name: password
              value: '{$VEEAM.PASSWORD}'
            - name: proxy
              value: '{$VEEAM.HTTP.PROXY}'
          tags:
            - tag: component
              value: raw
        - uuid: 74f14cdf666548528c06070747a3d452
