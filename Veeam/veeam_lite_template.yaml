zabbix_export:
  version: '7.2'
  template_groups:
    - uuid: ec00e4ea46d9445a91891dfb6af503f0
      name: Templates/Applications
  templates:
    - uuid: 87ae4c857feb4c6ca40b0628bd4652ec
      template: 'Veeam Backup Lite by HTTP'
      name: 'Veeam Backup Lite by HTTP'
      description: |
        Lightweight Veeam B&R REST monitoring with separate master items.
        Does NOT call /api/v1/jobs/states (slow Rest.GetJobStatesFiltered procedure).
        Job status is derived from the latest session per job within {$VEEAM.SESSIONS.HOURS}.
      groups:
        - name: Templates/Applications
      items:
        - uuid: 280eff92bcee4696980351132a6bb24b
          name: 'Veeam: Get repositories'
          type: SCRIPT
          key: veeam.lite.repos.get
          delay: '{$VEEAM.REPOS.INTERVAL}'
          history: 7d
          value_type: TEXT
          trends: '0'
          timeout: '{$VEEAM.DATA.TIMEOUT}'
          description: 'Raw data from /api/v1/backupInfrastructure/repositories/states (normalized).'
          params: |
            var p = JSON.parse(value),
                base = String(p.url).replace(/\/+$/, ''),
                req = new HttpRequest(),
                token = null;

            if (p.proxy) { req.setProxy(p.proxy); }

            function call(method, path, body) {
                req.clearHeader();
                req.addHeader('x-api-version: ' + p.version);
                req.addHeader('Accept: application/json');
                if (token) { req.addHeader('Authorization: Bearer ' + token); }
                var resp;
                if (method === 'POST') {
                    req.addHeader('Content-Type: application/x-www-form-urlencoded');
                    resp = req.post(base + path, body);
                } else {
                    resp = req.get(base + path);
                }
                var status = req.getStatus();
                if (status < 200 || status >= 300) {
                    throw 'HTTP ' + status + ' on ' + path + ': ' + String(resp).substring(0, 300);
                }
                return resp ? JSON.parse(resp) : {};
            }

            function login() {
                token = call('POST', '/api/oauth2/token',
                    'grant_type=password&username=' + encodeURIComponent(p.user) +
                    '&password=' + encodeURIComponent(p.password)).access_token;
                if (!token) { throw 'No access_token in token response'; }
            }

            function logout() {
                try { call('POST', '/api/oauth2/logout', ''); } catch (e) {}
            }

            function getAll(path) {
                var out = [], skip = 0, limit = 200, page;
                do {
                    page = call('GET', path + (path.indexOf('?') >= 0 ? '&' : '?') +
                        'skip=' + skip + '&limit=' + limit).data || [];
                    out = out.concat(page);
                    skip += limit;
                } while (page.length === limit && skip < 10000);
                return out;
            }

            login();
            var repos;
            try {
                repos = getAll('/api/v1/backupInfrastructure/repositories/states');
            } finally {
                logout();
            }

            var GB = 1073741824;
            return JSON.stringify(repos.map(function (r) {
                var cap = Number(r.capacityGB) || 0,
                    free = Number(r.freeGB) || 0,
                    used = Number(r.usedSpaceGB) || 0;
                return {
                    id: r.id,
                    name: r.name,
                    type: r.type,
                    host: r.hostName || '',
                    path: r.path || '',
                    capacity: Math.round(cap * GB),
                    free: Math.round(free * GB),
                    used: Math.round(used * GB),
                    free_pct: cap > 0 ? Math.round(free / cap * 10000) / 100 : -1,
                    online: typeof r.isOnline === 'boolean' ? (r.isOnline ? 1 : 0) : -1
                };
            }));
          parameters:
            - name: url
              value: '{$VEEAM.API.URL}'
            - name: version
              value: '{$VEEAM.API.VERSION}'
            - name: user
              value: '{$VEEAM.USER}'
            - name: password
              value: '{$VEEAM.PASSWORD}'
            - name: proxy
              value: '{$VEEAM.HTTP.PROXY}'
          tags:
            - tag: component
              value: raw
        - uuid: fc1d2b6a83544d2e98af163ff500bfe0
          name: 'Veeam: Get sessions'
          type: SCRIPT
          key: veeam.lite.sessions.get
          delay: '{$VEEAM.SESSIONS.INTERVAL}'
          history: 7d
          value_type: TEXT
          trends: '0'
          timeout: '{$VEEAM.DATA.TIMEOUT}'
          description: 'Sessions created in the last {$VEEAM.SESSIONS.HOURS}h, summarized (latest session per job decides failed/warning).'
          params: |
            var p = JSON.parse(value),
                base = String(p.url).replace(/\/+$/, ''),
                req = new HttpRequest(),
                token = null;

            if (p.proxy) { req.setProxy(p.proxy); }

            function call(method, path, body) {
                req.clearHeader();
                req.addHeader('x-api-version: ' + p.version);
                req.addHeader('Accept: application/json');
                if (token) { req.addHeader('Authorization: Bearer ' + token); }
                var resp;
                if (method === 'POST') {
                    req.addHeader('Content-Type: application/x-www-form-urlencoded');
                    resp = req.post(base + path, body);
                } else {
                    resp = req.get(base + path);
                }
                var status = req.getStatus();
                if (status < 200 || status >= 300) {
                    throw 'HTTP ' + status + ' on ' + path + ': ' + String(resp).substring(0, 300);
                }
                return resp ? JSON.parse(resp) : {};
            }

            function login() {
                token = call('POST', '/api/oauth2/token',
                    'grant_type=password&username=' + encodeURIComponent(p.user) +
                    '&password=' + encodeURIComponent(p.password)).access_token;
                if (!token) { throw 'No access_token in token response'; }
            }

            function logout() {
                try { call('POST', '/api/oauth2/logout', ''); } catch (e) {}
            }

            function getAll(path) {
                var out = [], skip = 0, limit = 200, page;
                do {
                    page = call('GET', path + (path.indexOf('?') >= 0 ? '&' : '?') +
                        'skip=' + skip + '&limit=' + limit).data || [];
                    out = out.concat(page);
                    skip += limit;
                } while (page.length === limit && skip < 10000);
                return out;
            }

            function parseTime(t) {
                // Trim fractional seconds to 3 digits for the JS engine
                return t ? Date.parse(String(t).replace(/(\.\d{3})\d+/, '$1')) : NaN;
            }

            var hours = parseInt(p.hours, 10) || 24,
                maxRun = parseFloat(p.running_max_hours) || 12,
                excl = (p.exclude && p.exclude !== 'CHANGE_IF_NEEDED') ? new RegExp(p.exclude, 'i') : null,
                exclType = (p.exclude_type && p.exclude_type !== 'CHANGE_IF_NEEDED') ? new RegExp(p.exclude_type, 'i') : null,
                exclRun = (p.exclude_running && p.exclude_running !== 'CHANGE_IF_NEEDED') ? new RegExp(p.exclude_running, 'i') : null,
                now = Date.now(),
                since = new Date(now - hours * 3600000).toISOString().replace(/\.\d+/, '');

            login();
            var sessions;
            try {
                sessions = getAll('/api/v1/sessions?createdAfterFilter=' + encodeURIComponent(since));
            } finally {
                logout();
            }

            var latest = {},
                states = {},
                types = {},
                res = { total: 0, jobs: 0, failed: 0, warning: 0, running: 0, long_running: 0 },
                names = { failed: [], warning: [], long_running: [] };

            sessions.forEach(function (s) {
                var name = s.name || '',
                    type = s.sessionType || 'Unknown';
                types[type] = (types[type] || 0) + 1;
                if (excl && excl.test(name)) { return; }
                if (exclType && exclType.test(type)) { return; }
                res.total++;

                var st = s.state || 'Unknown',
                    started = parseTime(s.creationTime);
                states[st] = (states[st] || 0) + 1;

                if (st !== 'Stopped') {
                    res.running++;
                    if (!isNaN(started) && now - started > maxRun * 3600000 &&
                            !(exclRun && exclRun.test(name))) {
                        res.long_running++;
                        names.long_running.push(name);
                    }
                }

                // Key by name: recurring system tasks get a new jobId per run
                if (!latest[name] || started > latest[name].t) {
                    latest[name] = { t: started, s: s };
                }
            });

            Object.keys(latest).forEach(function (k) {
                var s = latest[k].s,
                    r = s.result && s.result.result,
                    msg = (s.result && s.result.message) ? String(s.result.message).replace(/\s+/g, ' ').substring(0, 200) : '',
                    label = s.name + (msg ? ' (' + msg + ')' : '');
                res.jobs++;
                if (s.state !== 'Stopped') { return; }
                if (r === 'Failed') {
                    res.failed++;
                    names.failed.push(label);
                } else if (r === 'Warning') {
                    res.warning++;
                    names.warning.push(label);
                }
            });

            Object.keys(names).forEach(function (k) {
                res[k + '_names'] = names[k].length ? names[k].join('; ') : 'none';
            });
            res.states = states;
            res.types = types;

            return JSON.stringify(res);
          parameters:
            - name: url
              value: '{$VEEAM.API.URL}'
            - name: version
              value: '{$VEEAM.API.VERSION}'
            - name: user
              value: '{$VEEAM.USER}'
            - name: password
              value: '{$VEEAM.PASSWORD}'
            - name: proxy
              value: '{$VEEAM.HTTP.PROXY}'
            - name: hours
              value: '{$VEEAM.SESSIONS.HOURS}'
            - name: running_max_hours
              value: '{$VEEAM.RUNNING.MAX.HOURS}'
            - name: exclude
              value: '{$VEEAM.SESSION.NAME.NOT_MATCHES}'
            - name: exclude_type
              value: '{$VEEAM.SESSION.TYPE.NOT_MATCHES}'
            - name: exclude_running
              value: '{$VEEAM.RUNNING.NAME.NOT_MATCHES}'
          tags:
            - tag: component
              value: raw
        - uuid: 9a1856f9d8e54857bce4b8e9bb458a30
